<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Finora{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<header class="navbar"><div class="navbar-container">
  <a class="logo" href="{{ url_for('index') }}">🌸 Finora</a>
  <nav class="navigation">
    <a href="{{ url_for('index') }}">Главная</a>
    {% if current_user.is_authenticated %}
      <a href="{{ url_for('dashboard') }}">Кабинет</a>
      <a href="{{ url_for('logout') }}">Выйти</a>
    {% else %}
      <a href="{{ url_for('login') }}">Войти</a>
      <a href="{{ url_for('register') }}">Регистрация</a>
    {% endif %}
  </nav>
</div></header>
<main class="main-container">
  {% with messages = get_flashed_messages() %}
    {% for message in messages %}<div class="flash">{{ message }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<footer class="footer">Этап 2 · Авторизация</footer>
</body>
</html>
