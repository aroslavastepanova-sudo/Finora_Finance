{% extends "base.html" %}

{% block title %}Вход{% endblock %}

{% block content %}
<div class="card form-card">
    <h1>Вход</h1>

    <form method="post">
        <label>
            Имя пользователя
            <input name="username" required>
        </label>

        <label>
            Пароль
            <input type="password" name="password" required>
        </label>

        <button>Войти</button>
    </form>
</div>
{% endblock %}
