{% extends "base.html" %}

{% block title %}Кабинет{% endblock %}

{% block content %}
<div class="card">
    <h1>Кабинет</h1>

    <p>
        Пользователь: <strong>{{ current_user.username }}</strong>
    </p>

    <p>
        Добавлено операций: <strong>{{ transactions|length }}</strong>
    </p>

    <div class="actions">
        <a class="button" href="{{ url_for('add_transaction') }}">Добавить операцию</a>
        <a class="button secondary" href="{{ url_for('transactions') }}">История</a>
    </div>
</div>
{% endblock %}
